name: agentreservas_conductor
description: App móvil para conductores de AgentReservas — GEB
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP
  http: ^1.2.0
  http_parser: ^4.0.0
  web_socket_channel: ^2.4.0

  # Almacenamiento seguro del JWT
  flutter_secure_storage: ^9.0.0

  # Cámara con geolocalización obligatoria
  camera: ^0.10.5
  geolocator: ^11.0.0
  image_picker: ^1.1.0

  # GPS continuo (modo pánico)
  location: ^5.0.0

  # Estado
  provider: ^6.1.0

  # UI
  flutter_svg: ^2.0.0
  cached_network_image: ^3.3.0

  # Logging centralizado + escritura en archivo
  logger: ^2.4.0
  path_provider: ^2.1.0

  # Utilidades
  intl: ^0.19.0
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
